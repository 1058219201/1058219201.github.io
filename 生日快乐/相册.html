<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>旋转动画相册</title>
<style>
    body{
        background:pink;
    }
    .box1{
        width: 100%;
        height: 100%;
        font-style: italic;
        text-align: center;
        font-size: 60px;
        color: cyan;
        text-shadow: 3PX 3PX 6px #000000;
    }
    .box1::before,.box1::after{
        content: "";
        text-align: left;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.5);
        border-radius: 10px;
        box-shadow: 0 0 10px #fff;
        animation: animate 30s linear infinite;
    }
    .box1::before{
        transform: rotateY(90deg);
    }
    .box1::after{
        transform: rotateY(90deg) translateZ(-100px);
    }
    @keyframes animate {
        0%{
            transform: rotateY(0deg);
        }
        100%{
            transform: rotateY(360deg);
        }
    }
    * {
        padding: 0;
        margin: 0;
    }
    body, html {
        height: 100%;
    }
    #box {
        width: 280px;
        height: 400px;
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        margin: auto;
        transform-style: preserve-3d;
        transform: rotateX(0deg) rotateY(0deg);
        animation: go 20s linear infinite;
    }
    #box img {
        width: 280px;
        height: 400px;
        position: absolute;
        left: 0;
        top: 0;
    }
    #box img:nth-child(1) {
        transform: rotateY(0deg) translateZ(650px);
    }
    #box img:nth-child(2) {
        transform: rotateY(36deg) translateZ(650px);
    }
    #box img:nth-child(3) {
        transform: rotateY(72deg) translateZ(650px);
    }
    #box img:nth-child(4) {
        transform: rotateY(108deg) translateZ(650px);
    }
    #box img:nth-child(5) {
        transform: rotateY(144deg) translateZ(650px);
    }
    #box img:nth-child(6) {
        transform: rotateY(180deg) translateZ(650px);
    }
    #box img:nth-child(7) {
        transform: rotateY(216deg) translateZ(650px);
    }
    #box img:nth-child(8) {
        transform: rotateY(252deg) translateZ(650px);
    }
    #box img:nth-child(9) {
        transform: rotateY(288deg) translateZ(650px);
    }
    #box img:nth-child(10) {
        transform: rotateY(324deg) translateZ(650px);
    }
    @keyframes go {
        0% {
            transform: rotateX(0deg) rotateY(0deg);
        }
        25% {
            transform: rotateX(20deg) rotateY(180deg);
        }
        50% {
            transform: rotateX(0deg) rotateY(360deg);
        }
        75% {
            transform: rotateX(-20deg) rotateY(540deg);
        }
        100% {
            transform: rotateX(0deg) rotateY(720deg);
        }
    }
</style>
</head>
<body>
    <audio controls preload="auto" autoplay>
        <source src="./你从未离去.mp3" type="audio/mpeg"> 
    </audio>
    <h1 class="box1">生日快乐</h1>

</body>
</html>
